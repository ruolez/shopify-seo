services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      flask-app:
        condition: service_healthy
    restart: unless-stopped

  flask-app:
    build: .
    environment:
      - DATABASE_URL=postgresql://seo_user:seo_pass_2025@postgres:5432/shopify_seo
      - SECRET_KEY=change-me-in-production-use-random-bytes
      - ENCRYPTION_KEY=0JvebGzeT_f45boTiE9yk49bozjxqrRy4oEjH9e-qAU=
      - FLASK_ENV=production
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=shopify_seo
      - POSTGRES_USER=seo_user
      - POSTGRES_PASSWORD=seo_pass_2025
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo_user -d shopify_seo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
