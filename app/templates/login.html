<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SEO Platform</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo">S</div>
                <h1>SEO Platform</h1>
            </div>
            <p class="login-tagline">AI-powered SEO optimization for your Shopify store</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 16px; cursor: pointer; color: var(--on-surface-secondary);">
                    <input type="checkbox" id="remember-me" checked>
                    Keep me signed in for 30 days
                </label>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const remember = document.getElementById('remember-me').checked;
                await apiRequest('/api/login', {
                    method: 'POST',
                    body: { username, password, remember }
                });
                window.location.href = '/';
            } catch (err) {
                showToast(err.message, 'error');
            }
        });
    </script>
</body>
</html>
