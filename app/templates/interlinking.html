{% extends "base.html" %}



{% block content %}
<div class="toolbar-row" style="justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <button id="il-analyze-btn" class="btn btn-primary" data-page-action>
            <span class="material-symbols-rounded">travel_explore</span>
            <span id="il-analyze-label">Analyze</span>
        </button>
        <span id="il-status-chip" class="il-status-chip" style="display:none;"></span>
        <span id="il-stale-badge" class="il-stale-badge" style="display:none;"
              title="Counts are approximate after applied fixes — re-analyze for exact numbers">
            <span class="material-symbols-rounded" style="font-size:14px;">history</span> Approximate
        </span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
        <span id="il-last-analyzed" style="font-size:13px;color:var(--on-surface-secondary);"></span>
        <button class="btn btn-secondary" data-page-action onclick="TasksPanel.open({ page: '/interlinking' })">
            <span class="material-symbols-rounded">checklist</span> Activity
        </button>
    </div>
</div>

<div id="il-banner"></div>

<div id="il-auto-links" style="margin-top:12px;"></div>

<div id="il-stats" class="summary-strip" style="display:none;margin-top:12px;"></div>

<div class="tabs il-tabs" style="margin-top:16px;">
    <button class="tab" data-tab="overview">Overview</button>
    <button class="tab" data-tab="issues">Issues<span class="il-tab-count" data-count="issues"></span></button>
    <button class="tab" data-tab="coverage">Coverage<span class="il-tab-count" data-count="coverage"></span></button>
    <button class="tab" data-tab="opportunities">Opportunities<span class="il-tab-count" data-count="opportunities"></span></button>
</div>

<div class="tab-panel active" id="il-tab-overview"></div>
<div class="tab-panel" id="il-tab-issues"></div>
<div class="tab-panel" id="il-tab-coverage"></div>
<div class="tab-panel" id="il-tab-opportunities"></div>
{% endblock %}

{% block scripts %}
    <script src="/static/js/interlinking.js"></script>
    <script src="/static/js/auto_links.js"></script>
{% endblock %}
